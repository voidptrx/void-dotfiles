[main]
include=~/.config/theme/fuzzel.ini
font=Terminess Nerd Font Propo:size=12
use-bold=yes
dpi-aware=no
fields=filename,name,generic,keywords
terminal=foot
prompt="[search] => "
icon-theme=Papirus
icons-enabled=yes
show-actions=yes
anchor=center
lines=10
width=40
horizontal-pad=20
vertical-pad=20
inner-pad=5
line-height=20
image-size-ratio=1
layer=top
x-margin=10
y-margin=10

[border]
width=2
radius=0
