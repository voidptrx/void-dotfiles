[main]
include=~/.config/theme/fuzzel.ini
font=Terminess Nerd Font Propo:size=12
use-bold=yes
dpi-aware=no
fields=filename,name,generic,keywords
terminal=foot
prompt="[search] => "
icon-theme=Papirus
icons-enabled=yes
show-actions=yes
anchor=center
lines=10
width=40
horizontal-pad=20
vertical-pad=20
inner-pad=5
line-height=20
image-size-ratio=1
layer=top

; [colors]
; background=000000ff
; prompt=8a9a7bff
; input=c5c9c5ff
; text=a6a69cff
; match=8a9a7bff
; selection=8a9a7bff
; selection-text=000000ff
; selection-match=000000ff
; border=8a9a7bff

[border]
width=2
radius=0
